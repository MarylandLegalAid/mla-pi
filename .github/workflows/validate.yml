name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # No install step: this package has no dependencies, on purpose.
      - name: Validate package structure
        run: node scripts/validate.mjs --verbose

      - name: Run tests
        run: npm test

      # ubuntu-latest runners ship shellcheck already; no install step needed.
      - name: Shellcheck the shell scripts
        run: shellcheck install.sh scripts/bootstrap.sh

      - name: Check shell script syntax
        run: |
          bash -n install.sh
          bash -n scripts/bootstrap.sh
